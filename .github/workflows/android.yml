name: Android CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Powered by SCARY · Open source: the Apache License 2.0 NOTICE requires the credit; the build fails without it.
      - name: SCARY credit check
        run: bash .github/scripts/check-credit.sh

      # The phone remote's page signs commands in JavaScript; it must agree with RemoteProtocol.kt byte for byte.
      - name: Phone remote page check
        run: node tools/remote/check-remote-js.cjs

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      # The same debug key for every build, so a new APK installs over the old one without losing settings.
      # The key is created by the first build and kept in the Actions cache, never in the repository.
      # Pull requests from forks never get it: their builds are signed with a throwaway key, and so cannot pass as
      # official updates (core/update/Updates.kt, the stable channel below).
      - name: Restore debug signing key
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/cache@v6
        with:
          path: ~/.android/debug.keystore
          key: android-debug-keystore-v1

      # The signing key from repository secrets, when it is there: every APK of this repository, debug and release,
      # main and branches, is then signed with it, so any of them installs over any other and over what the TVs have.
      # Pull requests from forks get no secrets. Without it, the cached debug key above is used.
      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.SCARY_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SCARY_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using the release key from secrets."
          else
            echo "No release key secret; the APKs are signed with the debug key."
          fi

      - name: Core unit tests (catalog, search, PIN, curation, links)
        run: ./gradlew --no-daemon :core:test

      - name: Build debug APK
        env:
          SCARY_KEYSTORE_PASSWORD: ${{ secrets.SCARY_KEYSTORE_PASSWORD }}
          SCARY_KEY_ALIAS: ${{ secrets.SCARY_KEY_ALIAS }}
          SCARY_KEY_PASSWORD: ${{ secrets.SCARY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Build UI test APK
        env:
          SCARY_KEYSTORE_PASSWORD: ${{ secrets.SCARY_KEYSTORE_PASSWORD }}
          SCARY_KEY_ALIAS: ${{ secrets.SCARY_KEY_ALIAS }}
          SCARY_KEY_PASSWORD: ${{ secrets.SCARY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleDebugAndroidTest

      - name: Lint
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Build release APK (R8, not debuggable)
        env:
          SCARY_KEYSTORE_PASSWORD: ${{ secrets.SCARY_KEYSTORE_PASSWORD }}
          SCARY_KEY_ALIAS: ${{ secrets.SCARY_KEY_ALIAS }}
          SCARY_KEY_PASSWORD: ${{ secrets.SCARY_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Name the APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/scary-debug-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/release/app-release.apk "dist/scary-release-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk "dist/scary-tests-${GITHUB_RUN_NUMBER}.apk"
          ls -l dist
          sha256sum dist/*.apk

      # Every APK of a push to the official repository is signed with the key the TVs trust (the certificates are
      # public, so they are printed). Pull requests from forks are signed with throwaway keys and not checked here.
      - name: Signed with the official key
        if: github.event_name == 'push' && github.repository == 'diamondrubinny/Scary'
        run: |
          set -euo pipefail
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          EXPECTED=$(tr -d ' \n' < .github/update-signing-cert.sha256)
          for apk in dist/scary-release-*.apk dist/scary-debug-*.apk; do
            # "Signer #1 certificate SHA-256 digest: …" or, in newer apksigner, "Signer (minSdkVersion=…) certificate …".
            CERTS=$("$SIGNER" verify --print-certs "$apk" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' | sort -u)
            echo "$apk: ${CERTS:-none found}"
            [ -n "$CERTS" ] || "$SIGNER" verify --print-certs "$apk"
            if [ "$CERTS" != "$EXPECTED" ]; then
              echo "::error::$apk is not signed with the official key."
              exit 1
            fi
          done
          echo "Signed with: ${SCARY_KEYSTORE_FILE:+the key from secrets}${SCARY_KEYSTORE_FILE:-the cached debug key}"

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: scary-apks
          path: dist/scary-*.apk
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            app/build/reports/
            core/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    # Only for pushes to this repository, never for pull requests, and only after the release APK passed the
    # emulator smoke test in the screenshots job.
    if: github.event_name == 'push'
    needs: [build, screenshots, screenshots-mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            app/build.gradle.kts

      - uses: actions/download-artifact@v8
        with:
          name: scary-apks
          path: dist

      - name: Publish as the "latest-build" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # scary.apk is the optimized release build; scary-debug.apk stays available as a fallback.
          cp dist/scary-release-*.apk dist/scary.apk
          cp dist/scary-debug-*.apk dist/scary-debug.apk
          # Release notes in four languages, with this build's number and commit.
          sed -e "s/{{BUILD}}/${GITHUB_RUN_NUMBER}/" -e "s/{{SHA}}/${GITHUB_SHA::7}/" .github/release-notes.md > notes.md
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build dist/scary.apk dist/scary-debug.apk \
            --target "${GITHUB_SHA}" \
            --prerelease \
            --title "SCARY build ${GITHUB_RUN_NUMBER}" \
            --notes-file notes.md

      # The update every official SCARY offers by itself: only from main, only in the official repository, and only
      # signed with the official key (.github/update-signing-cert.sha256, the same value the app pins). A fork, a
      # pull request or a work branch never reaches it. If the signing key were ever lost and a new one made, this
      # step fails instead of shipping an update no TV could install.
      - name: Publish the stable update (official main only)
        if: github.repository == 'diamondrubinny/Scary' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          APK=dist/scary-release-${GITHUB_RUN_NUMBER}.apk
          SIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          CERTS=$("$SIGNER" verify --print-certs "$APK" | grep -oE 'certificate SHA-256 digest: [0-9a-f]{64}' | awk '{print $NF}' | sort -u)
          EXPECTED=$(tr -d ' \n' < .github/update-signing-cert.sha256)
          if [ "$(printf '%s\n' "$CERTS" | wc -l)" != 1 ] || [ "$CERTS" != "$EXPECTED" ]; then
            echo "::error::The release APK is not signed with the official key ($CERTS). Not published as an update."
            exit 1
          fi
          VERSION_NAME=$(sed -n 's/^ *versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          cp "$APK" dist/stable-scary.apk
          python3 .github/scripts/update-manifest.py dist/stable-scary.apk "$GITHUB_RUN_NUMBER" "$VERSION_NAME" .github/update-notes.json dist/update.json
          mkdir -p stable && cp dist/stable-scary.apk stable/scary.apk && cp dist/update.json stable/update.json
          printf 'SCARY %s, build %s (%s). Official SCARY on a TV offers it by itself.\n' "$VERSION_NAME" "$GITHUB_RUN_NUMBER" "${GITHUB_SHA::7}" > stable-notes.md
          gh release delete stable --cleanup-tag --yes || true
          gh release create stable stable/scary.apk stable/update.json \
            --target "${GITHUB_SHA}" \
            --latest \
            --title "SCARY ${VERSION_NAME} (build ${GITHUB_RUN_NUMBER})" \
            --notes-file stable-notes.md

      - name: Keep the APK on the apk-builds branch
        run: |
          git init -q out && cd out
          cp ../dist/scary.apk ../dist/scary-debug.apk .
          printf 'Latest SCARY APK (release, R8), build %s from %s. scary-debug.apk is the debug build.\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}" > README.md
          git add scary.apk scary-debug.apk README.md
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "SCARY build ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/apk-builds

  screenshots:
    # Runs the real APK on an Android TV emulator and stores the screenshots on the "screenshots" branch.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: scary-apks
          path: dist

      - name: Prepare APKs
        run: |
          cp dist/scary-debug-*.apk dist/scary.apk
          cp dist/scary-release-*.apk dist/scary-release.apk
          cp dist/scary-tests-*.apk dist/scary-tests.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on Android TV emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots.sh

      # Cold start and UI test results in the run summary; a warning (not a failure) when start-up gets slow.
      - name: Start-up time and UI tests
        if: always()
        run: |
          if [ -f screenshots/ui-tests.txt ]; then
            { echo "### UI tests"; echo '```'; cat screenshots/ui-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f screenshots/startup.txt ]; then
            { echo "### Cold start (release)"; echo '```'; cat screenshots/startup.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            median=$(grep '^speed-profile:' screenshots/startup.txt | cut -d: -f2 | tr ' ' '\n' | sed '/^$/d' | sort -n | sed -n 2p)
            if [ -n "$median" ] && [ "$median" -gt 2500 ]; then
              echo "::warning::Release cold start is ${median} ms on the emulator (limit 2500 ms). Check what slowed it down."
            fi
          fi

      - name: Upload screenshots
        uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
          retention-days: 14

      - name: Keep screenshots on the screenshots branch
        run: |
          git init -q out && cd out
          cp ../screenshots/*.png .
          cp ../screenshots/startup.txt ../screenshots/ui-tests.txt ../screenshots/trailer-log.txt . 2>/dev/null || true
          printf 'SCARY screenshots from an Android TV emulator, build %s (%s).\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}" > README.md
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Screenshots for build ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/screenshots

  screenshots-mobile:
    # The same APK on a phone emulator: the phone layout tests, then each main screen as a phone and as a tablet
    # (upright and on its side). Stored on the "screenshots-mobile" branch.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: scary-apks
          path: dist

      - name: Prepare APKs
        run: |
          cp dist/scary-debug-*.apk dist/scary.apk
          cp dist/scary-tests-*.apk dist/scary-tests.apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on a phone emulator and capture screens
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/screenshots-mobile.sh

      - name: Phone layout tests
        if: always()
        run: |
          if [ -f screenshots-mobile/ui-tests.txt ]; then
            { echo "### Phone and tablet layout tests"; echo '```'; cat screenshots-mobile/ui-tests.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-mobile
          path: screenshots-mobile/
          retention-days: 14

      - name: Keep screenshots on the screenshots-mobile branch
        run: |
          git init -q out && cd out
          cp ../screenshots-mobile/*.png ../screenshots-mobile/ui-tests.txt .
          printf 'SCARY screenshots from a phone emulator (phone and tablet sizes), build %s (%s).\n' "${GITHUB_RUN_NUMBER}" "${GITHUB_SHA::7}" > README.md
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -qm "Phone and tablet screenshots for build ${GITHUB_RUN_NUMBER}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" HEAD:refs/heads/screenshots-mobile
