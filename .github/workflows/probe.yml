name: Probe Cinemeta
on:
  push:
    branches: [probe-cinemeta]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          set -x
          curl -sS https://v3-cinemeta.strem.io/meta/movie/tt0081505.json | head -c 4000; echo
          curl -sS "https://v3-cinemeta.strem.io/catalog/movie/top/genre=Horror.json" | head -c 2500; echo
          curl -sS "https://v3-cinemeta.strem.io/catalog/movie/top/genre=Horror.json" | python3 -c "import json,sys; d=json.load(sys.stdin); m=d['metas']; print(len(m)); print(sorted({k for x in m for k in x}))"
          curl -sS "https://v3-cinemeta.strem.io/catalog/movie/imdbRating/genre=Horror.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['metas']), [x['name'] for x in d['metas'][:5]])" || true
          curl -sS "https://v3-cinemeta.strem.io/catalog/movie/top/genre=Thriller.json" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d['metas']), [x['name'] for x in d['metas'][:5]])" || true
          curl -sS https://v3-cinemeta.strem.io/manifest.json | head -c 3000; echo
          curl -sSI https://images.metahub.space/background/medium/tt0081505/img | head -5
          curl -sSI https://images.metahub.space/poster/medium/tt0081505/img | head -5
          curl -sSI https://images.metahub.space/logo/medium/tt0081505/img | head -5
