name: Probe Cinemeta
on:
  push:
    branches: [probe-cinemeta]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe
        run: |
          curl -sSL https://v3-cinemeta.strem.io/manifest.json | python3 -c "import json,sys; d=json.load(sys.stdin); [print(c['id'], c.get('type'), [ (e.get('name'), e.get('isRequired'), (e.get('options') or [])[:40]) for e in c.get('extra',[])]) for c in d['catalogs']]"
          for u in "catalog/movie/top/genre=Horror.json" "catalog/movie/top/genre%3DHorror.json" "catalog/movie/top.json" "catalog/movie/imdbRating/genre=Horror.json" "catalog/movie/top/genre=Thriller.json"; do
            echo "== $u"; curl -sSL -o out.json -w "%{http_code} %{size_download} %{url_effective}\n" "https://v3-cinemeta.strem.io/$u"
            python3 -c "import json; d=json.load(open('out.json')); m=d.get('metas',[]); print(len(m), sorted({k for x in m for k in x})); print([ (x.get('name'), x.get('releaseInfo'), x.get('imdbRating'), x.get('background','')[:60]) for x in m[:4]])" || head -c 300 out.json
          done
          curl -sSI https://images.metahub.space/background/medium/tt0081505/img | head -4
          curl -sSI https://images.metahub.space/poster/medium/tt0081505/img | head -4
