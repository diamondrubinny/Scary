<!--
  "Scan to share this movie": the page a phone opens from the QR code on a SCARY movie page. Static: the film travels
  in the link (?i=IMDb id&t=title&y=year&l=language), and every part of it is treated as untrusted (share.js).
  No cookies, no analytics, no storage.
-->
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://images.metahub.space; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0a0b0b">
  <title>SCARY · Watch tonight</title>
  <meta name="description" content="A horror film shared from SCARY, the horror home screen for Android TV.">
  <meta property="og:title" content="SCARY · Watch tonight">
  <meta property="og:description" content="A horror film shared from SCARY, the horror home screen for Android TV.">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="share.css">
  <script src="share.js" defer></script>
</head>
<body>
  <main id="main">
    <p class="brand" aria-hidden="true">SCARY</p>
    <p class="kicker" id="kicker">Watch tonight</p>

    <article class="film" id="film" hidden>
      <img class="poster" id="poster" alt="" width="300" height="450" hidden>
      <div class="info">
        <h1 id="title"></h1>
        <p class="year" id="year"></p>
        <div class="actions">
          <button type="button" class="primary" id="share" hidden>Share</button>
          <button type="button" id="copy" hidden>Copy link</button>
          <a class="button" id="imdb" rel="noopener noreferrer">Open on IMDb</a>
        </div>
        <p class="status" id="status" role="status" aria-live="polite"></p>
      </div>
    </article>

    <p class="error" id="error" hidden>This link is broken. Ask for a new one: scan the code on the movie's page in SCARY again.</p>
    <noscript><p class="error">This page needs JavaScript to show the film.</p></noscript>
  </main>

  <footer>
    <p id="from">Shared from SCARY, the horror home screen for Android TV.</p>
    <p><a id="get" href="https://github.com/diamondrubinny/Scary" rel="noopener noreferrer">Get SCARY</a> · <bdi>Powered by SCARY · Open source</bdi></p>
  </footer>
</body>
</html>
