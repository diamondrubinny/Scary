# SCARY · scary.network: the Content-Security-Policy that goes with site/index.html.
# The page's inline <style> and <script> are allowed only by their SHA-256 hashes: every change to either one needs
# the new hashes here (tools/site/build.py prints them). Replaces the current add_header line in the server block.
add_header Content-Security-Policy "default-src 'none'; style-src 'sha256-na4e0NCx6uwRJyBHBxp54WFJHWBdVmerVrxmPrItV60='; script-src 'sha256-T81H6VKYyJVl/ulYE3RF+dPtt3A7zJXyUHz85o8BdrA='; img-src 'self' data:; font-src data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
